<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="GeoShape 看国家轮廓猜国家 封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e2147"/>
      <stop offset="1" stop-color="#123a73"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- 经纬网格 -->
  <g stroke="#7dd3fc" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
    <ellipse cx="600" cy="337" rx="560" ry="120" fill="none"/>
    <ellipse cx="600" cy="337" rx="380" ry="250" fill="none"/>
  </g>

  <!-- 抽象国家轮廓：散布的"大陆碎片" -->
  <g fill="#1d4ed8" fill-opacity="0.18" stroke="url(#stroke)" stroke-width="2.4" filter="url(#soft)">
    <!-- 中央大轮廓 -->
    <path d="M470 250 L560 210 L640 235 L700 215 L760 260 L740 320 L770 370 L700 400 L620 380 L560 410 L500 370 L520 310 L470 290 Z"/>
    <!-- 左上小国 -->
    <path d="M150 180 L230 165 L255 205 L215 240 L160 225 Z"/>
    <!-- 右上小国 -->
    <path d="M900 200 L985 185 L1010 225 L960 260 L905 245 Z"/>
    <!-- 左下小国 -->
    <path d="M210 470 L300 455 L320 500 L265 530 L215 510 Z"/>
    <!-- 右下小国 -->
    <path d="M930 470 L1015 460 L1035 505 L975 535 L925 515 Z"/>
    <!-- 底部长条国 -->
    <path d="M540 520 L640 512 L660 545 L600 575 L545 558 Z"/>
  </g>

  <!-- 中央问号：猜国家 -->
  <text x="615" y="345" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800"
        fill="#e0f2fe" fill-opacity="0.92" text-anchor="middle" filter="url(#soft)">?</text>

  <!-- 放大镜，呼应"辨识轮廓" -->
  <g transform="translate(835,300) rotate(35)" stroke="url(#stroke)" stroke-width="9" fill="none" filter="url(#soft)">
    <circle cx="0" cy="0" r="58" fill="#0e2147" fill-opacity="0.55"/>
    <line x1="42" y1="42" x2="105" y2="105" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- 品牌角标 -->
  <text x="1120" y="640" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"
        fill="#7dd3fc" fill-opacity="0.75" text-anchor="end" letter-spacing="1">GeoShape</text>
</svg>
