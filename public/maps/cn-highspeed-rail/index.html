<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/shared/ga-bridge.js"></script>
  <script src="/shared/map-i18n.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国高铁网络时间轴 · 互动地图</title>
  <meta name="description" content="拖动时间轴，看 2008—2026 年中国高铁网络一年一年铺开。点线路看开通年份、里程与沿线城市，点城市看经过的高铁。" />
  <meta name="keywords" content="中国高铁,高铁线路图,高铁时间轴,高速铁路,高铁网络,交通地理,互动地图" />
  <meta name="author" content="PlanetGIS" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/maps/_shared/maplibre-gl.css" />
  <link rel="stylesheet" href="css/style.v1.css" />
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <h1>中国高铁网络时间轴</h1>
    <p class="sub">2008—2026 · 拖动时间轴，看高铁网络一年一年铺开</p>
  </div>

  <aside class="side-panel" id="side-panel">
    <button class="drawer-handle" id="drawer-handle" type="button" aria-label="展开或收起目录" aria-expanded="true"><i></i></button>
    <div class="panel-head">
      <h2>线路目录</h2>
      <button class="panel-close" id="panel-close" aria-label="收起目录">×</button>
    </div>
    <div class="panel-stats">
      <div><b id="stat-lines">–</b><span>线路</span></div>
      <div><b id="stat-stations">–</b><span>城市</span></div>
      <div><b id="stat-km">–</b><span>里程(万km)</span></div>
      <div><b>2026</b><span>截至年</span></div>
    </div>
    <div class="panel-tools">
      <div class="pt-group">
        <span class="pt-label">开通年代（点名称可开关对应线路）</span>
        <div class="era-filter" id="era-filter"></div>
      </div>
    </div>
    <div class="line-list" id="line-list"></div>
    <div class="list-count" id="list-count"></div>
    <div class="panel-foot">
      <div class="ctrl-nav">
        <a href="/maps/cn-highspeed-rail" target="_top">作品介绍</a>
        <a href="/maps" target="_top">全部地图</a>
      </div>
    </div>
  </aside>
  <button class="panel-open" id="panel-open" type="button" aria-label="展开线路目录">目录</button>

  <div class="top-right">
    <div class="top-search">
      <input type="text" id="search" placeholder="搜索线路 / 城市 / 省份" autocomplete="off" />
      <ul id="searchResult"></ul>
    </div>
    <button class="map-opts-btn" id="map-opts-btn" type="button" aria-label="底图与叠加设置" aria-expanded="false" title="底图与叠加设置">⚙</button>
    <div class="map-opts" id="map-opts" role="dialog" aria-label="底图与叠加设置">
      <div class="mo-group">
        <span class="mo-label">底图（三选一）</span>
        <div class="bm-seg">
          <label class="bm-opt"><input type="radio" name="basemap" value="img" checked /><span>卫星影像</span></label>
          <label class="bm-opt"><input type="radio" name="basemap" value="vec" /><span>矢量路网</span></label>
          <label class="bm-opt"><input type="radio" name="basemap" value="none" /><span>无底图</span></label>
        </div>
      </div>
      <div class="mo-group">
        <span class="mo-label">叠加</span>
        <div class="mo-row">
          <button class="tool-btn" id="toggleProv" aria-pressed="false">省级密度</button>
          <button class="tool-btn" id="toggleStation" aria-pressed="true">城市节点</button>
          <button class="tool-btn" id="toggleLabel" aria-pressed="true">城市标注</button>
        </div>
      </div>
      <div class="mo-group">
        <span class="mo-label">线路宽度</span>
        <div class="mo-row">
          <button class="tool-btn" id="thinLine" aria-pressed="false">细</button>
          <button class="tool-btn" id="thickLine" aria-pressed="true">粗</button>
        </div>
      </div>
    </div>
  </div>

  <div class="timeline">
    <button class="tl-play" id="tl-play" type="button" aria-label="播放高铁建设时间轴">▶</button>
    <div class="tl-slider-wrap">
      <div class="tl-top"><span class="tl-year" id="tl-year">2026 年</span><span class="tl-cum" id="tl-cum">累计 <b>0</b> 条 · <b>0</b> 万 km</span></div>
      <input type="range" class="tl-slider" id="tl-slider" min="2008" max="2026" step="1" value="2026" />
      <div class="tl-scale"><span>2008</span><span>2012</span><span>2017</span><span>2022</span><span>2026</span></div>
    </div>
  </div>

  <div class="data-note" id="data-note">线路走向以主要城市节点连线示意，非精确轨道几何。里程与开通年份见各线路详情卡。</div>

  <script src="/maps/_shared/maplibre-gl.js"></script>
  <script src="js/app.v2.js"></script>
</body>
</html>
