<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/shared/ga-bridge.js"></script>
  <script src="/shared/map-i18n.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>豆瓣电影 Top250 全球分布图 · 互动地图</title>
  <meta name="description" content="按主产国查看豆瓣电影 Top250 在全球的分布，点击国家看上榜电影海报墙，1931—2023 上映年份回放。" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/maps/_shared/maplibre-gl.css" />
  <link rel="stylesheet" href="css/style.v3.css" />
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <h1>豆瓣电影 Top250 全球分布图</h1>
    <p class="sub">250 部电影 · 19 个主产国 · 国名+数量标注 · 点国家看海报墙 · 1931—2023 年份回放</p>
  </div>

  <!-- 左侧国家目录（移动端为底部抽屉） -->
  <aside class="side-panel" id="side-panel">
    <button class="drawer-handle" id="drawer-handle" type="button" aria-label="展开或收起目录" aria-expanded="true"><i></i></button>
    <div class="panel-head">
      <h2>主产国目录</h2>
      <button class="panel-close" id="panel-close" aria-label="收起目录">×</button>
    </div>
    <div class="panel-stats">
      <div><b id="stat-stores">–</b><span>上榜电影</span></div>
      <div><b id="stat-cities">–</b><span>主产国</span></div>
      <div><b id="stat-provs">–</b><span>大洲</span></div>
      <div><b>2026</b><span>快照</span></div>
    </div>
    <div class="panel-tools">
      <div class="pt-group">
        <span class="pt-label">上榜电影数（灰=0 · 绿→红递增）</span>
        <div class="era-filter" id="era-filter"><!-- JS 渲染 --></div>
      </div>
      <div class="pt-group">
        <span class="pt-label">大洲筛选</span>
        <select class="prov-select" id="prov-select"><!-- JS 渲染 --></select>
      </div>
    </div>
    <div class="city-list" id="city-list"><!-- JS 渲染 --></div>
    <div class="list-count" id="list-count"></div>
    <div class="panel-foot">
      <div class="ctrl-nav">
        <a href="/maps/douban-top250" target="_top">作品介绍</a>
        <a href="/maps" target="_top">全部地图</a>
      </div>
    </div>
  </aside>
  <button class="panel-open" id="panel-open" type="button" aria-label="展开国家目录" aria-expanded="true">目录</button>

  <!-- 右侧详情面板：完整榜单 -->
  <aside class="detail-panel" id="detail-panel" aria-hidden="true" aria-label="国家电影榜单">
    <button class="dp-close" id="dp-close" aria-label="关闭详情" title="关闭">×</button>
    <div class="dp-body" id="dp-body"><!-- JS 渲染完整榜单 --></div>
  </aside>

  <!-- 右上角：搜索框 + 底图/叠加设置 -->
  <div class="top-right">
    <div class="top-search">
      <input type="text" id="search" placeholder="搜索国家 / 电影名 / 英文名" autocomplete="off" />
      <ul id="searchResult"></ul>
    </div>
    <button class="map-opts-btn" id="map-opts-btn" type="button" aria-label="底图与叠加设置" aria-expanded="false" title="底图与叠加设置">⚙</button>
    <div class="map-opts" id="map-opts" role="dialog" aria-label="底图与叠加设置">
      <div class="mo-group">
        <span class="mo-label">底图（三选一）</span>
        <div class="bm-seg">
          <label class="bm-opt"><input type="radio" name="basemap" value="none" /><span>深色</span></label>
          <label class="bm-opt"><input type="radio" name="basemap" value="img" checked /><span>卫星影像</span></label>
          <label class="bm-opt"><input type="radio" name="basemap" value="vec" /><span>地形晕渲</span></label>
        </div>
      </div>
      <div class="mo-group">
        <span class="mo-label">叠加</span>
        <div class="mo-row">
          <button class="tool-btn" id="toggleProv" aria-pressed="true">国家着色</button>
          <button class="tool-btn" id="toggleLabel" aria-pressed="true">国家标注</button>
        </div>
      </div>
      <div class="mo-group">
        <span class="mo-label">口径</span>
        <span style="font-size:11px;color:var(--text-muted);line-height:1.6">一部片按第一制片国计入；中国香港、中国台湾、中国大陆并入「中国」。海报来自豆瓣，点海报跳转原页。</span>
      </div>
    </div>
  </div>

  <!-- 底部分年份时间轴 -->
  <div class="timeline">
    <button class="tl-play" id="tl-play" type="button" aria-label="播放上映年份时间轴">▶</button>
    <div class="tl-slider-wrap">
      <div class="tl-top"><span class="tl-year" id="tl-year">2023 年 · 累计上榜 250 部</span><span class="tl-cum" id="tl-cum" title="回放数值 = 上映年份 ≤ 当前年的上榜电影数，非当年产量">已上映上榜 <b>250</b> 部</span></div>
      <input type="range" class="tl-slider" id="tl-slider" min="1931" max="2023" step="1" value="2023" />
      <div class="tl-scale"><span>1931</span><span>1960</span><span>1990</span><span>2010</span><span>2023</span></div>
    </div>
  </div>

  <script src="/maps/_shared/maplibre-gl.js"></script>
  <script src="js/app.v3.js"></script>
</body>
</html>
