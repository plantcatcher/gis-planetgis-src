<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/shared/ga-bridge.js"></script>
  <script src="/shared/map-i18n.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我国一级 / 二级 / 三级河流分布图 · 互动地图</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/maps/_shared/maplibre-gl.css" />
  <link rel="stylesheet" href="css/style.v7.css" />
</head>
<body>
  <div id="map"></div>

  <!-- 顶部标题（位于目录面板右侧留白处） -->
  <div class="topbar">
    <h1>我国主要河流分布图</h1>
    <p class="sub">国家基础地理 1:100万 水系 · 一级 / 二级 / 三级 / 四级 / 五级 · 点击河流查看详情</p>
  </div>

  <!-- 左侧河流目录面板（移动端为底部抽屉，抓手条收展） -->
  <aside class="side-panel" id="side-panel">
    <button class="drawer-handle" id="drawer-handle" type="button" aria-label="展开或收起河流目录" aria-expanded="true"><i></i></button>
    <div class="panel-head">
      <h2>河流目录</h2>
      <button class="panel-close" id="panel-close" aria-label="收起目录">×</button>
    </div>
    <div class="panel-stats">
      <div><b id="stat-rivers">–</b><span>河流</span></div>
      <div><b id="stat-segs">–</b><span>线段</span></div>
      <div><b id="stat-len">–</b><span>总长km</span></div>
      <div><b id="stat-lv">–</b><span>分级</span></div>
    </div>
    <div class="panel-tools">
      <div class="pt-group">
        <span class="pt-label">图例（点名称可开关对应河流）</span>
        <div class="level-filter" id="level-filter"><!-- JS 渲染：一~五级 + 运河 + 水域面，带勾选与条数 --></div>
      </div>
    </div>
    <div class="river-list" id="river-list"><!-- JS 渲染 --></div>
    <div class="list-count" id="list-count"></div>
    <div class="panel-foot">
      <div class="ctrl-nav">
        <a href="/works/cn-rivers" target="_top">作品介绍</a>
        <a href="/maps" target="_top">全部地图</a>
      </div>
      <a class="dl-link" href="https://planetgis.cn/downloads/cn-zhuyao-shuixi-shp" target="_blank" rel="noopener">⬇ 下载原始水系 SHP 数据</a>
    </div>
  </aside>
  <button class="panel-open" id="panel-open" type="button" aria-label="展开河流目录" aria-expanded="true">目录</button>

  <!-- 右上角：搜索框（外框）+ 底图/叠加设置图标（点击在图标下方展开弹层） -->
  <div class="top-right">
    <div class="top-search">
      <input type="text" id="search" placeholder="搜索河流：中文 / 拼音" autocomplete="off" />
      <ul id="searchResult"></ul>
    </div>
    <button class="map-opts-btn" id="map-opts-btn" type="button" aria-label="底图与叠加设置" aria-expanded="false" title="底图与叠加设置">⚙</button>
    <div class="map-opts" id="map-opts" role="dialog" aria-label="底图与叠加设置">
      <div class="mo-group">
        <span class="mo-label">底图（三选一）</span>
        <div class="bm-seg">
          <label class="bm-opt"><input type="radio" name="basemap" value="img" checked /><span>卫星影像</span></label>
          <label class="bm-opt"><input type="radio" name="basemap" value="vec" /><span>矢量路网</span></label>
          <label class="bm-opt"><input type="radio" name="basemap" value="none" /><span>无底图</span></label>
        </div>
      </div>
      <div class="mo-group">
        <span class="mo-label">叠加</span>
        <div class="mo-row">
          <button class="tool-btn" id="toggleWater" aria-pressed="true">水域面</button>
          <button class="tool-btn" id="toggleLabel" aria-pressed="true">河流标注</button>
          <button class="tool-btn" id="toggleBorder" aria-pressed="true">省级边界</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 名称标注层：由 JS 注入到地图容器内，确保弹窗层级高于标注 -->

  <script src="/maps/_shared/maplibre-gl.js"></script>
  <script src="js/app.v6.js"></script>
</body>
</html>
