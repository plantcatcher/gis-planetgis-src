<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="离我最近的门店 · 中国品牌最近距离查询">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.55" stop-color="#0a1a2e"/>
      <stop offset="1" stop-color="#103048"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#040912" stop-opacity="0.98"/>
      <stop offset="0.7" stop-color="#040912" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#040912" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd8f0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4fd8f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fb4d8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="890" cy="325" r="330" fill="url(#glow)"/>

  <!-- 右侧雷达：同心圈 + 放射线 + 品牌色节点 -->
  <g fill="none" stroke="#4fd8f0" stroke-opacity="0.16">
    <circle cx="890" cy="325" r="70"/>
    <circle cx="890" cy="325" r="132"/>
    <circle cx="890" cy="325" r="194"/>
    <circle cx="890" cy="325" r="256"/>
    <circle cx="890" cy="325" r="318"/>
  </g>
  <g stroke-width="2" stroke-opacity="0.7">
    <path d="M890 325 L890 145" stroke="#f59e0b"/>
    <path d="M890 325 L1046 235" stroke="#4a9bff"/>
    <path d="M890 325 L1046 415" stroke="#a78bfa"/>
    <path d="M890 325 L890 505" stroke="#e4002b"/>
    <path d="M890 325 L734 415" stroke="#38bdf8"/>
    <path d="M890 325 L734 235" stroke="#22c55e"/>
  </g>
  <g>
    <circle cx="890" cy="145" r="7" fill="#f59e0b"/>
    <circle cx="1046" cy="235" r="7" fill="#4a9bff"/>
    <circle cx="1046" cy="415" r="7" fill="#a78bfa"/>
    <circle cx="890" cy="505" r="7" fill="#e4002b"/>
    <circle cx="734" cy="415" r="7" fill="#38bdf8"/>
    <circle cx="734" cy="235" r="7" fill="#22c55e"/>
  </g>
  <circle cx="890" cy="325" r="16" fill="#4fd8f0" fill-opacity="0.18" stroke="#4fd8f0" stroke-opacity="0.5"/>
  <circle cx="890" cy="325" r="6" fill="#4fd8f0" stroke="#ffffff" stroke-width="2"/>

  <!-- 左侧渐隐遮罩 + 标题 -->
  <rect x="0" y="0" width="770" height="675" fill="url(#mask)"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
    <text x="64" y="66" fill="#4fd8f0" font-size="19" font-weight="700" letter-spacing="4">PLANETGIS · 互动地图</text>
    <text x="62" y="158" fill="#ffffff" font-size="68" font-weight="800">离我最近的</text>
    <text x="62" y="238" fill="#4fd8f0" font-size="68" font-weight="800">门店与地标</text>
    <text x="66" y="292" fill="#c8d9ec" font-size="23">输入城市 · 点一下地图 · 13 类品牌距离实时重算</text>

    <g font-size="14" fill="#8ea3bf">
      <text x="66" y="344" font-size="13" letter-spacing="2">13 BRANDS / 10,897 POI / 437 CITIES</text>
    </g>

    <g transform="translate(64,392)">
      <g fill="#ffffff" font-size="30" font-weight="800">
        <text x="0" y="0">13</text>
        <text x="150" y="0">10,897</text>
        <text x="340" y="0">437</text>
        <text x="490" y="0">0</text>
      </g>
      <g fill="#8ea3bf" font-size="14">
        <text x="0" y="26">类品牌</text>
        <text x="150" y="26">个点位</text>
        <text x="340" y="26">座城市</text>
        <text x="490" y="26">外部 API</text>
      </g>
      <g stroke="#4fd8f0" stroke-opacity="0.35">
        <path d="M120 -24 V30 M310 -24 V30 M460 -24 V30"/>
      </g>
    </g>

    <text x="64" y="632" fill="#7f96b3" font-size="16">数据来源：站内 13 张互动地图 · GCJ-02 · 直线距离非驾车距离 · planetgis.cn</text>
  </g>
</svg>
