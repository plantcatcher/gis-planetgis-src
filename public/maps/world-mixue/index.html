<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/shared/ga-bridge.js"></script>
  <script src="/shared/map-i18n.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全球蜜雪冰城分布图 · 互动地图</title>
  <meta name="description" content="按市场查看蜜雪冰城全球 20 个在营市场的门店分布、门店数排行与 1997—2026 年全球化进程；逐市场合计 51,612 家，中国内地 46,812、海外约 4,800。" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/maps/_shared/maplibre-gl.css" />
  <link rel="stylesheet" href="css/style.v1.css" />
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <h1>全球蜜雪冰城分布图</h1>
    <p class="sub">全球 51,612 家门店 · 20 个在营市场 · 中国内地 46,812 / 海外约 4,800（2026-11）· 1997—2026 全球化回放</p>
  </div>

  <!-- 左侧国家目录（移动端为底部抽屉） -->
  <aside class="side-panel" id="side-panel">
    <button class="drawer-handle" id="drawer-handle" type="button" aria-label="展开或收起目录" aria-expanded="true"><i></i></button>
    <div class="panel-head">
      <h2>国家 / 市场目录</h2>
      <button class="panel-close" id="panel-close" aria-label="收起目录">×</button>
    </div>
    <div class="panel-stats">
      <div><b id="stat-stores">–</b><span>门店</span></div>
      <div><b id="stat-cities">–</b><span>在营市场</span></div>
      <div><b id="stat-provs">–</b><span>大洲</span></div>
      <div><b>11-07</b><span>2026</span></div>
    </div>
    <div class="panel-tools">
      <div class="pt-group">
        <span class="pt-label">市场门店数（颜色越暖门店越多）</span>
        <div class="era-filter" id="era-filter"><!-- JS 渲染 --></div>
      </div>
      <div class="pt-group">
        <span class="pt-label">大洲筛选</span>
        <select class="prov-select" id="prov-select"><!-- JS 渲染 --></select>
      </div>
    </div>
    <div class="city-list" id="city-list"><!-- JS 渲染 --></div>
    <div class="list-count" id="list-count"></div>
    <div class="panel-foot">
      <div class="ctrl-nav">
        <a href="/maps/world-mixue" target="_top">作品介绍</a>
        <a href="/maps" target="_top">全部地图</a>
      </div>
    </div>
  </aside>
  <button class="panel-open" id="panel-open" type="button" aria-label="展开市场目录" aria-expanded="true">目录</button>

  <!-- 右上角：搜索框 + 底图/叠加设置 -->
  <div class="top-right">
    <div class="top-search">
      <input type="text" id="search" placeholder="搜索国家 / 市场 / 英文名" autocomplete="off" />
      <ul id="searchResult"></ul>
    </div>
    <button class="map-opts-btn" id="map-opts-btn" type="button" aria-label="底图与叠加设置" aria-expanded="false" title="底图与叠加设置">⚙</button>
    <div class="map-opts" id="map-opts" role="dialog" aria-label="底图与叠加设置">
      <div class="mo-group">
        <span class="mo-label">底图（三选一）</span>
        <div class="bm-seg">
          <label class="bm-opt"><input type="radio" name="basemap" value="none" checked /><span>深色</span></label>
          <label class="bm-opt"><input type="radio" name="basemap" value="img" /><span>卫星影像</span></label>
          <label class="bm-opt"><input type="radio" name="basemap" value="vec" /><span>地形晕渲</span></label>
        </div>
      </div>
      <div class="mo-group">
        <span class="mo-label">叠加</span>
        <div class="mo-row">
          <button class="tool-btn" id="toggleProv" aria-pressed="true">国家密度</button>
          <button class="tool-btn" id="toggleLabel" aria-pressed="true">市场标注</button>
        </div>
      </div>
      <div class="mo-group">
        <span class="mo-label">提示</span>
        <span style="font-size:11px;color:var(--text-muted);line-height:1.6">卫星与地形底图来自 Esri，境外服务在国内加载较慢；深色底图无需外网瓦片。</span>
      </div>
    </div>
  </div>

  <!-- 底部全球化时间轴 -->
  <div class="timeline">
    <button class="tl-play" id="tl-play" type="button" aria-label="播放全球化时间轴">▶</button>
    <div class="tl-slider-wrap">
      <div class="tl-top"><span class="tl-year" id="tl-year">2026 年 · 累计进入 20 个市场</span><span class="tl-cum" id="tl-cum" title="回放数值 = 已进驻市场按 2026 年逐市场快照门店数求和，不是当年真实门店数">已进驻市场门店 <b>51,612</b> 家</span></div>
      <input type="range" class="tl-slider" id="tl-slider" min="1997" max="2026" step="1" value="2026" />
      <div class="tl-scale"><span>1997</span><span>2010</span><span>2018</span><span>2022</span><span>2026</span></div>
    </div>
  </div>

  <script src="/maps/_shared/maplibre-gl.js"></script>
  <script src="js/app.v1.js"></script>
</body>
</html>
